name: projectv

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projectv-api
    ports:
      - "${PORT:-3100}:3100"
    environment:
      NODE_ENV: production
      PORT: 3100
      MONGODB_URI: mongodb://mongo:27017/${MONGODB_DB:-projectv}
      MONGODB_DB: ${MONGODB_DB:-projectv}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - projectv-network

  mongo:
    image: mongo:7.0
    container_name: projectv-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-projectv}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - projectv-network

volumes:
  mongo-data:
    driver: local

networks:
  projectv-network:
    driver: bridge

